<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b12" />
    </linearGradient>

    <linearGradient id="strata1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="strata2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="strata3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="strata4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #334155; stroke-width: 0.5; opacity: 0.25; }
    .wave { animation: drift 10s ease-in-out infinite alternate; }
    .pulse-glow { animation: pulse 6s ease-in-out infinite alternate; }
    .scan-beam { animation: scan 8s linear infinite; }
    .particle { animation: float 7s ease-in-out infinite alternate; }

    @keyframes drift {
      0% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-8px) scaleY(1.03); }
      100% { transform: translateY(6px) scaleY(0.98); }
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }

    @keyframes scan {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(1100px); opacity: 0; }
    }

    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(5px); }
      100% { transform: translateY(8px) translateX(-5px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }

    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #cbd5e1;
    }

    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Slate Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Geological / Stratigraphic 3D Mesh Grid Background -->
  <g class="grid-layer">
    <line x1="100" y1="0" x2="100" y2="420" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="420" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="420" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="420" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="420" class="grid-line" />
    <line x1="850" y1="0" x2="850" y2="420" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="420" class="grid-line" />
    <line x1="1150" y1="0" x2="1150" y2="420" class="grid-line" />

    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
  </g>

  <!-- Dynamic Stratigraphic Fold & Fault Layers (Background Geology) -->
  <g class="wave">
    <!-- Basal Stratum Layer 4 -->
    <path d="M 0 320 Q 250 290 500 340 T 1000 310 T 1200 330 L 1200 420 L 0 420 Z" fill="url(#strata4)" />
    
    <!-- Intermediate Stratum Layer 3 -->
    <path d="M 0 340 Q 300 310 600 360 T 1050 330 T 1200 350 L 1200 420 L 0 420 Z" fill="url(#strata3)" />
    
    <!-- Petroleum / Hydrogeology Stratum Layer 2 -->
    <path d="M 0 365 Q 220 330 480 375 T 920 350 T 1200 370 L 1200 420 L 0 420 Z" fill="url(#strata2)" />

    <!-- Bedrock Stratum Layer 1 -->
    <path d="M 0 390 Q 280 370 550 400 T 1100 380 T 1200 395 L 1200 420 L 0 420 Z" fill="url(#strata1)" />
  </g>

  <!-- Glowing Fault Line & Borehole Trajectories (Subtle Animation) -->
  <g class="pulse-glow" filter="url(#glow)">
    <line x1="480" y1="270" x2="620" y2="420" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" />
    <line x1="820" y1="260" x2="900" y2="420" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,5" />
    <circle cx="480" cy="270" r="4" fill="#f59e0b" />
    <circle cx="820" cy="260" r="4" fill="#38bdf8" />
  </g>

  <!-- Laser / Seismic Scan Beam Sweeping across subsurface -->
  <g class="scan-beam">
    <line x1="50" y1="260" x2="50" y2="420" stroke="#2dd4bf" stroke-width="2" opacity="0.6" filter="url(#glow)" />
    <circle cx="50" cy="260" r="3" fill="#2dd4bf" />
  </g>

  <!-- Ambient Floating Data Particles -->
  <g class="particle" opacity="0.6">
    <circle cx="150" cy="110" r="3" fill="#38bdf8" />
    <circle cx="320" cy="70" r="2" fill="#2dd4bf" />
    <circle cx="980" cy="95" r="3.5" fill="#f59e0b" />
    <circle cx="1090" cy="150" r="2" fill="#38bdf8" />
    <circle cx="70" cy="280" r="2.5" fill="#94a3b8" />
    <circle cx="1130" cy="290" r="3" fill="#10b981" />
  </g>

  <!-- Top Accent Glow Orb -->
  <circle cx="600" cy="0" r="280" fill="url(#glowPulse)" filter="url(#glow)" />

  <!-- FOREGROUND: Clear Title, Subtitle, and Feature Badges (Never Obscured) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(420, 48)">
      <rect x="0" y="0" width="360" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="18" cy="16" r="5" fill="#2dd4bf" />
      <text x="32" y="21" fill="#38bdf8" class="badge-text">CURATED GEOSCIENCE COMPUTATION &amp; MODELING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#titleGrad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Geological Modeling &amp; Spatial Stratigraphy
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="172" text-anchor="middle" class="subtitle-text">
      3D Implicit Surfaces • Borehole Logging • Spatial Geostatistics • Geophysical Inversion
    </text>

    <!-- Interactive / Feature Pills Group -->
    <g transform="translate(130, 206)">
      <!-- Pill 1: 3D Implicit Modeling -->
      <g transform="translate(0, 0)">
        <rect width="210" height="38" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" opacity="0.95" />
        <text x="105" y="24" text-anchor="middle" fill="#e2e8f0" class="badge-text">📐 GemPy &amp; LoopStructural</text>
      </g>

      <!-- Pill 2: Boreholes & Well Logs -->
      <g transform="translate(230, 0)">
        <rect width="210" height="38" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
        <text x="105" y="24" text-anchor="middle" fill="#e2e8f0" class="badge-text">🪵 Striplog, Welly &amp; LASIO</text>
      </g>

      <!-- Pill 3: Geostatistics & Kriging -->
      <g transform="translate(460, 0)">
        <rect width="230" height="38" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" opacity="0.95" />
        <text x="115" y="24" text-anchor="middle" fill="#e2e8f0" class="badge-text">📊 GSTools, PyKrige &amp; GeoStats</text>
      </g>

      <!-- Pill 4: 3D Subsurface Viz -->
      <g transform="translate(710, 0)">
        <rect width="230" height="38" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
        <text x="115" y="24" text-anchor="middle" fill="#e2e8f0" class="badge-text">🌐 PyVista, QGIS &amp; SimPEG</text>
      </g>
    </g>
  </g>
</svg>
